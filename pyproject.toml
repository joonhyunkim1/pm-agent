[project]
name = "pm-agent"
version = "0.1.0"
description = "내 프로젝트들을 지켜보고, 비용을 따져 개선하는 AI 프로젝트 매니저"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "platformdirs>=4.2",
    "typer>=0.12",
    "packaging>=24.0",
    "openai>=2.0",
]

[project.scripts]
pm = "pm.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
